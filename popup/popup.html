<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName">FocusQuota</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="appName">FocusQuota</h1>
    <div class="usage">
      <p class="label" data-i18n="popupLabel">Today's casual browsing</p>
      <p class="numbers"><span id="used-min">0</span> / <span id="limit-min">0</span> <span data-i18n="popupMinuteUnit">min</span></p>
      <p class="remaining" id="remaining"></p>
    </div>
    <button id="open-options" data-i18n="popupOpenOptions">Open settings</button>
    <p class="version">v<span id="version"></span></p>
    <p class="sponsor-link"><a href="https://ko-fi.com/achillesy" target="_blank" rel="noopener" data-i18n="sponsorCoffee">☕ Buy me a coffee</a></p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
