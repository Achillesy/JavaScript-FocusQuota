<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FocusQuota</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>FocusQuota</h1>
    <div class="usage">
      <p class="label">今日普通上网时间</p>
      <p class="numbers"><span id="used-min">0</span> / <span id="limit-min">0</span> 分钟</p>
      <p class="remaining" id="remaining">剩余 <span id="remaining-min">0</span> 分钟</p>
    </div>
    <button id="open-options">打开设置</button>
    <p class="version">v<span id="version"></span></p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
