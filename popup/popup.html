<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName">FocusQuota</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="appName">FocusQuota</h1>
    <div class="usage">
      <p class="label" data-i18n="popupLabel">今日普通上网时间</p>
      <p class="numbers"><span id="used-min">0</span> / <span id="limit-min">0</span> <span data-i18n="popupMinuteUnit">分钟</span></p>
      <p class="remaining" id="remaining"></p>
    </div>
    <button id="open-options" data-i18n="popupOpenOptions">打开设置</button>
    <p class="version">v<span id="version"></span></p>
    <p class="sponsor-link"><a href="https://ko-fi.com/achillesy" target="_blank" rel="noopener" data-i18n="sponsorCoffee">☕ 请作者喝杯咖啡</a></p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
